env:
  IMAGE_NAME: YOUR_DOCKERHUB_USERNAME/aiops-incident-app

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: CI - Build, Test, Push
  # ─────────────────────────────────────────────
  build-test-push:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally (for testing)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: test-image:${{ steps.sha.outputs.short_sha }}

      - name: Smoke test — API health check
        run: |
          docker run -d --name test-container -p 8000:8000 \
            -e PINECONE_API_KEY=dummy -e HF_API_TOKEN=dummy \
            test-image:${{ steps.sha.outputs.short_sha }}
          sleep 8
          echo "Checking /health endpoint..."
          curl -sf http://localhost:8000/health || (docker logs test-container && exit 1)

      - name: Smoke test — Frontend check
        run: |
          echo "Checking /ui frontend..."
          curl -sf http://localhost:8000/ui | grep -qi "AIOps Incident Assistant" \
            || (echo "❌ Frontend not serving correctly!" && docker logs test-container && exit 1)
          echo "✅ Frontend is serving correctly"
          docker stop test-container && docker rm test-container

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push final image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Notify Slack — CI passed
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"✅ CI passed (health + frontend tested) — image ${{ steps.sha.outputs.short_sha }} pushed to DockerHub\"}" \
          "${{ secrets.SLACK_WEBHOOK_URL }}"

  # ─────────────────────────────────────────────
  # JOB 2: CD - Update manifest, trigger ArgoCD sync
  # ─────────────────────────────────────────────
  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update image tag in K8s manifest
        run: |
          sed -i "s|image: .*aiops-incident-app.*|image: ${{ env.IMAGE_NAME }}:${{ needs.build-test-push.outputs.short_sha }}|g" k8s-manifests/deployment.yaml
          echo "Updated manifest:"
          grep "image:" k8s-manifests/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/deployment.yaml
          git commit -m "CD: deploy image ${{ needs.build-test-push.outputs.short_sha }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Notify Slack — CD triggered
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"🚀 CD triggered — ArgoCD will sync image ${{ needs.build-test-push.outputs.short_sha }} to k3s cluster within seconds\"}" \
          "${{ secrets.SLACK_WEBHOOK_URL }}"
