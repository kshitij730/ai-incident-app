name: Deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: false
        default: latest
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: kshitijsharma788/aiops-incident-app

jobs:
  deploy:
    name: Deploy to k3s
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/ubuntu/.kube/config
    steps:
      - name: Resolve image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to k3s cluster
        run: |
          kubectl set image deployment/aiops-incident-app \
            aiops-incident-app=${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          kubectl rollout status deployment/aiops-incident-app --timeout=120s

      - name: Notify Slack that deployment completed
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Deployed image ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }} to k3s\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
