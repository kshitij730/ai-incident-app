name: Sonar Scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sonar-scan:
    name: SonarQube scan
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=app,frontend
            -Dsonar.python.version=3.10
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Skip SonarQube when secrets are missing
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == ''
        run: echo "Set SONAR_TOKEN and SONAR_HOST_URL secrets to enable SonarQube."
